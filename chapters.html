<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Chapters | GyanAstra Master</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="assets/css/chapters.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo">🚀</span>
        <div class="brand-text">
          <strong>GyanAstra</strong>
          <span>MASTER ADMIN</span>
        </div>
      </div>

      <nav class="admin-nav">
        <div class="nav-title">MAIN</div>
        <a href="./dashboard.html" class="nav-item">📊 Dashboard</a>

        <div class="nav-title">ACADEMIC MANAGEMENT</div>
        <a href="./courses.html" class="nav-item">📚 Courses</a>
        <a href="./subjects.html" class="nav-item">📖 Subjects</a>
        <a href="./chapters.html" class="nav-item active">📑 Chapters</a>
        <a href="./lessons.html" class="nav-item">🎥 Lessons & Videos</a>
        <a href="./uploads.html" class="nav-item">📂 Study Materials (PDFs)</a>

        <div class="nav-title">USERS & SETTINGS</div>
        <a href="./students.html" class="nav-item">👥 Students</a>
        <a href="./settings.html" class="nav-item">⚙️ Settings</a>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="menu-btn" id="menuBtn">☰</button>
          <div class="topbar-title">
            <span>MANAGEMENT</span>
            <h1>Chapters</h1>
          </div>
        </div>
        <button class="primary-btn" id="openModalBtn">➕ Add New Chapter</button>
      </header>

      <!-- Page Body -->
      <div class="page">
        <!-- Filter Toolbar -->
        <div class="filter-toolbar">
          <div class="filter-item">
            <label for="filterSubject">Filter by Subject:</label>
            <select id="filterSubject">
              <option value="all">All Subjects</option>
            </select>
          </div>
        </div>

        <!-- Chapters List Container -->
        <div class="chapters-container" id="chaptersContainer">
          <div class="empty-state" id="loadingState">Loading chapters...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Chapter Modal -->
  <div class="modal-overlay" id="chapterModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Chapter</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="chapterForm">
        <input type="hidden" id="chapterId">

        <div class="form-group">
          <label for="subjectSelect">Select Subject</label>
          <select id="subjectSelect" required>
            <option value="">-- Choose Subject --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="chapterNumber">Chapter Number / Sequence</label>
          <input type="number" id="chapterNumber" placeholder="e.g. 1, 2, 3" min="1" required>
        </div>

        <div class="form-group">
          <label for="chapterTitle">Chapter Title</label>
          <input type="text" id="chapterTitle" placeholder="e.g. 1857 Revolt, Indian Preamble" required>
        </div>

        <div class="form-group">
          <label for="chapterDescription">Description (Optional)</label>
          <textarea id="chapterDescription" rows="2" placeholder="Brief outline of chapter topics..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn" id="saveChapterBtn">Save Chapter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase & App Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./assets/js/firebase-config.js"></script>
  <script src="./assets/js/chapters.js"></script>
</body>
</html>
