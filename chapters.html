<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Chapters | GyanAstra Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">🚀</div>
            <div>
                <h2>GyanAstra</h2>
                <small>MASTER ADMIN</small>
            </div>
        </div>

        <nav class="nav-menu">
            <span class="nav-label">MAIN</span>
            <a href="./dashboard.html" class="nav-link">📊 Dashboard</a>

            <span class="nav-label">LEARNING PATHS</span>
            <a href="./courses.html" class="nav-link">📚 Courses & GS</a>
            <a href="./subjects.html" class="nav-link">📑 Subjects</a>
            <a href="./chapters.html" class="nav-link active">📖 Chapters</a>
            <a href="./lessons.html" class="nav-link">🎥 Video Lessons</a>
            <a href="./pdfs.html" class="nav-link">📁 E-Library (PDFs)</a>

            <span class="nav-label">SYSTEM</span>
            <a href="./students.html" class="nav-link">👥 Students</a>
            <a href="./settings.html" class="nav-link">⚙️ Settings</a>
        </nav>

        <div class="logout-box">
            <button id="logoutBtn" class="btn-logout" type="button">🚪 Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <header class="topbar">
            <div>
                <span class="sub-header">ACADEMIC STRUCTURE</span>
                <h1>Manage Chapters</h1>
            </div>
            <button id="openChapterModalBtn" class="primary-btn" type="button">➕ Add New Chapter</button>
        </header>

        <!-- CHAPTERS TABLE -->
        <section class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ORDER</th>
                        <th>CHAPTER TITLE</th>
                        <th>SUBJECT</th>
                        <th>DESCRIPTION</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="chapterTableBody">
                    <tr>
                        <td colspan="5" style="padding: 24px; text-align: center; color: var(--text-secondary);">Chapters load ho rahe hain...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- ADD CHAPTER MODAL -->
    <div id="chapterModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-header">Add New Chapter</h3>
            <form id="chapterForm">
                <div class="form-group">
                    <label>Select Parent Subject</label>
                    <select id="chapterSubjectSelect" required>
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Chapter Title</label>
                    <input type="text" id="chapterTitle" required placeholder="e.g. Chapter 1: Revolt of 1857">
                </div>

                <div class="form-group">
                    <label>Chapter Order / Sequence</label>
                    <input type="number" id="chapterOrder" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label>Description / Overview</label>
                    <textarea id="chapterDescription" rows="3" placeholder="Summary or syllabus topics included..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="closeChapterModalBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="primary-btn">Save Chapter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="./assets/js/firebase-config.js"></script>

    <!-- Page Logic -->
    <script src="./assets/js/chapters.js"></script>
</body>
</html>
