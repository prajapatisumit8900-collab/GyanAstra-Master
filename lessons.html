<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lessons | GyanAstra Admin</title>
    <link rel="stylesheet" href="./assets/css/dashboard.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/lessons.css">
</head>
<body>

<div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">🚀</span>
            <div>
                <h2>GyanAstra</h2>
                <small>MASTER ADMIN</small>
            </div>
        </div>

        <nav class="nav-menu">
            <span class="nav-label">MAIN</span>
            <a href="./dashboard.html" class="nav-link">📊 Dashboard</a>

            <span class="nav-label">ACADEMIC CONTENT</span>
            <a href="./courses.html" class="nav-link">📚 Courses & GS</a>
            <a href="./subjects.html" class="nav-link">📑 Subjects</a>
            <a href="./chapters.html" class="nav-link">📖 Chapters</a>
            <a href="./lessons.html" class="nav-link active">🎥 Video Lessons</a>
            <a href="./pdfs.html" class="nav-link">📁 E-Library (PDFs)</a>

            <span class="nav-label">USERS & SETTINGS</span>
            <a href="./students.html" class="nav-link">👥 Students</a>
            <a href="./settings.html" class="nav-link">⚙️ Settings</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div>
                <span class="section-label">MANAGEMENT</span>
                <h1>Video Lessons</h1>
            </div>
            <button id="openLessonModalBtn" class="action-btn" type="button">+ Add New Video Lesson</button>
        </header>

        <!-- LESSONS TABLE -->
        <section class="table-card" style="margin-top: 24px; background: #1e293b; padding: 20px; border-radius: 10px;">
            <table style="width: 100%; border-collapse: collapse; color: #f8fafc; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid #334155; color: #94a3b8;">
                        <th style="padding: 12px;">ORDER</th>
                        <th style="padding: 12px;">LESSON TITLE</th>
                        <th style="padding: 12px;">CHAPTER</th>
                        <th style="padding: 12px;">VIDEO LINK</th>
                        <th style="padding: 12px;">ACTION</th>
                    </tr>
                </thead>
                <tbody id="lessonsTableBody">
                    <tr>
                        <td colspan="5" style="padding: 20px; text-align: center; color: #94a3b8;">Video lessons load ho rahe hain...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<!-- LESSON MODAL -->
<div id="lessonModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: #1e293b; padding: 24px; border-radius: 10px; width: 460px; color: #f8fafc; border: 1px solid #334155;">
        <h2 style="margin-bottom: 16px;">Add Video Lesson</h2>
        <form id="lessonForm">
            <div style="margin-bottom: 12px;">
                <label style="display:block; margin-bottom: 6px; font-size: 13px;">Lesson Title</label>
                <input type="text" id="lessonTitle" required placeholder="e.g. 1857 Revolt Causes" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff;">
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display:block; margin-bottom: 6px; font-size: 13px;">Select Chapter</label>
                <select id="lessonChapterSelect" required style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff;">
                    <option value="">-- Choose Chapter --</option>
                </select>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display:block; margin-bottom: 6px; font-size: 13px;">Video Order / Number</label>
                <input type="number" id="lessonOrder" value="1" min="1" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff;">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display:block; margin-bottom: 6px; font-size: 13px;">YouTube / Drive Video URL</label>
                <input type="url" id="lessonVideoUrl" required placeholder="https://www.youtube.com/watch?v=..." style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" id="closeLessonModalBtn" style="padding: 8px 16px; background: #334155; border: none; border-radius: 6px; color: #fff; cursor: pointer;">Cancel</button>
                <button type="submit" style="padding: 8px 16px; background: #2563eb; border: none; border-radius: 6px; color: #fff; cursor: pointer;">Save Lesson</button>
            </div>
        </form>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./assets/js/firebase-config.js"></script>

<!-- Page Logic -->
<script src="./assets/js/lessons.js"></script>
</body>
</html>
