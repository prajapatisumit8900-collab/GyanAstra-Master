<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students | GyanAstra Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">🚀</div>
            <div>
                <h2>GyanAstra</h2>
                <small>MASTER ADMIN</small>
            </div>
        </div>

        <nav class="nav-menu">
            <span class="nav-label">MAIN</span>
            <a href="./dashboard.html" class="nav-link">📊 Dashboard</a>

            <span class="nav-label">LEARNING PATHS</span>
            <a href="./courses.html" class="nav-link">📚 Courses & GS</a>
            <a href="./subjects.html" class="nav-link">📑 Subjects</a>
            <a href="./chapters.html" class="nav-link">📖 Chapters</a>
            <a href="./lessons.html" class="nav-link">🎥 Video Lessons</a>
            <a href="./pdfs.html" class="nav-link">📁 E-Library (PDFs)</a>

            <span class="nav-label">SYSTEM</span>
            <a href="./students.html" class="nav-link active">👥 Students</a>
            <a href="./settings.html" class="nav-link">⚙️ Settings</a>
        </nav>

        <div class="logout-box">
            <button id="logoutBtn" class="btn-logout" type="button">🚪 Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <header class="topbar">
            <div>
                <span class="sub-header">USER MANAGEMENT</span>
                <h1>Registered Students</h1>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <input type="text" id="searchStudentInput" placeholder="Search by name, email..." style="padding: 10px 14px; background: #0B0F19; border: 1px solid var(--border); border-radius: 8px; color: #fff; width: 240px; font-size: 14px; outline: none;">
                <button id="refreshStudentsBtn" class="primary-btn" type="button" style="background: #1E293B; box-shadow: none; border: 1px solid var(--border);">🔄 Refresh</button>
            </div>
        </header>

        <!-- STUDENTS TABLE -->
        <section class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>STUDENT NAME</th>
                        <th>EMAIL ADDRESS</th>
                        <th>TARGET EXAM</th>
                        <th>JOINED DATE</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="5" style="padding: 24px; text-align: center; color: var(--text-secondary);">Students list load ho rahi hai...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="./assets/js/firebase-config.js"></script>

    <!-- Page Logic -->
    <script src="./assets/js/students.js"></script>
</body>
</html>
