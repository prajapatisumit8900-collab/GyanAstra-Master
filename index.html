<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="GyanAstra Master Admin Panel"
    >

    <title>Admin Login | GyanAstra Master</title>

    <link
        rel="stylesheet"
        href="./assets/css/login.css"
    >
</head>

<body>

    <!-- ==============================
         ADMIN LOGIN PAGE
    =============================== -->

    <main class="login-page">

        <section class="login-card">

            <!-- LOGO -->
            <div class="brand">

                <div class="brand-icon">
                    🚀
                </div>

                <h1>
                    GyanAstra
                </h1>

                <span>
                    MASTER
                </span>

            </div>


            <!-- TITLE -->

            <div class="login-heading">

                <h2>
                    Admin Login
                </h2>

                <p>
                    GyanAstra Master Control Panel
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">

                <!-- EMAIL / USERNAME -->

                <div class="input-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        name="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberAdmin"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- ERROR / SUCCESS MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="loginButtonText">
                        🔐 Login to Admin Panel
                    </span>

                </button>

            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <p>
                    GyanAstra Master
                </p>

                <span>
                    Authorized Admin Access Only
                </span>

            </div>

        </section>

    </main>


    <!-- AUTH JAVASCRIPT -->

    <script src="./assets/js/auth.js"></script>

</body>
</html>
