<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | GyanAstra Master</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <span class="brand-icon">🚀</span>
      <h1>GyanAstra</h1>
      <span>MASTER CONTROL</span>
      <p>Authorized Admin Access Only</p>
    </div>

    <div class="error-msg" id="errorMsg" style="display: none; color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <div class="input-wrapper">
          <input type="email" id="adminEmail" placeholder="Enter admin email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPassword" placeholder="Enter password" required>
          <button type="button" class="toggle-pwd" id="togglePwd" title="Show/Hide">👁️</button>
        </div>
      </div>

      <div class="remember-group" style="margin-bottom: 16px;">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe" style="font-size: 13px; color: #64748b;">Remember me</label>
      </div>

      <button type="submit" class="login-btn" style="width: 100%; cursor: pointer;">🔐 Login to Admin Panel</button>
    </form>

    <div class="card-footer" style="margin-top: 20px; text-align: center;">
      <small style="color: #94a3b8; font-weight: 600; font-size: 11px;">GYANASTRA BY SUMITSTUDYIQ</small>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./assets/js/firebase-config.js"></script>
  <script src="./assets/js/login.js"></script>
</body>
</html>
