<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses | GyanAstra Master</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/courses.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo">🚀</span>
        <div class="brand-text">
          <strong>GyanAstra</strong>
          <span>MASTER ADMIN</span>
        </div>
      </div>

      <nav class="admin-nav">
        <div class="nav-title">MAIN</div>
        <a href="./dashboard.html" class="nav-item">📊 Dashboard</a>

        <div class="nav-title">ACADEMIC MANAGEMENT</div>
        <a href="./courses.html" class="nav-item active">📚 Courses</a>
        <a href="./subjects.html" class="nav-item">📖 Subjects</a>
        <a href="./chapters.html" class="nav-item">📑 Chapters</a>
        <a href="./lessons.html" class="nav-item">🎥 Lessons & Videos</a>
        <a href="./uploads.html" class="nav-item">📂 Study Materials (PDFs)</a>

        <div class="nav-title">USERS & SETTINGS</div>
        <a href="./students.html" class="nav-item">👥 Students</a>
        <a href="./settings.html" class="nav-item">⚙️ Settings</a>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="menu-btn" id="menuBtn">☰</button>
          <div class="topbar-title">
            <span>MANAGEMENT</span>
            <h1>Courses</h1>
          </div>
        </div>
        <button class="primary-btn" id="openModalBtn">➕ Add New Course</button>
      </header>

      <!-- Page Body -->
      <div class="page">
        <!-- Courses List Grid -->
        <div class="courses-grid" id="coursesGrid">
          <div class="empty-state" id="loadingState">Loading courses...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Course Modal Dialog -->
  <div class="modal-overlay" id="courseModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Course</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="courseForm">
        <input type="hidden" id="courseId">

        <div class="form-group">
          <label for="courseTitle">Course Name / Title</label>
          <input type="text" id="courseTitle" placeholder="e.g. UPSC Prelims Foundation" required>
        </div>

        <div class="form-group">
          <label for="courseCategory">Category</label>
          <input type="text" id="courseCategory" placeholder="e.g. Civil Services / SSC / Railway" required>
        </div>

        <div class="form-group">
          <label for="courseDescription">Description</label>
          <textarea id="courseDescription" rows="3" placeholder="Brief outline of the course..."></textarea>
        </div>

        <div class="form-group">
          <label for="courseThumbnail">Thumbnail Image URL</label>
          <input type="url" id="courseThumbnail" placeholder="https://example.com/image.jpg">
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn" id="saveCourseBtn">Save Course</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase & App Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./assets/js/firebase-config.js"></script>
  <script src="./assets/js/courses.js"></script>
</body>
</html>
